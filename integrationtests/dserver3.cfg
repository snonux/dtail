{
  "Server": {
    "MaxConcurrentCats": 4,
    "MaxConnections": 12,
    "Schedule": [
      {
        "Name": "dserver_schedule_group_test_a",
        "Enable": true,
        "AllowFrom": [
          "localhost"
        ],
        "TimeRange": [
          0,
          24
        ],
        "Files": "./mapr_testdata.log",
        "Query": "from STATS select count($line),last($time),avg($goroutines),min(concurrentConnections),max(lifetimeConnections) group by $hostname",
        "Outfile": "./dserver3a.csv.tmp"
      },
      {
        "Name": "dserver_schedule_group_test_b",
        "Enable": true,
        "AllowFrom": [
          "localhost"
        ],
        "TimeRange": [
          0,
          24
        ],
        "Files": "./mapr_testdata.log",
        "Query": "from STATS select count($line),last($time),avg($goroutines),min(concurrentConnections),max(lifetimeConnections) group by $hostname where lifetimeConnections >= 3",
        "Outfile": "./dserver3b.csv.tmp"
      },
      {
        "Name": "dserver_schedule_group_test_c",
        "Enable": true,
        "AllowFrom": [
          "localhost"
        ],
        "TimeRange": [
          0,
          24
        ],
        "Files": "./mapr_testdata.log",
        "Query": "from STATS select count($time),$time,max($goroutines),avg($goroutines),min($goroutines) group by $time order by count($time)",
        "Outfile": "./dserver3c.csv.tmp"
      }
    ]
  }
}
